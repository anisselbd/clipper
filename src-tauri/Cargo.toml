# SCAFFOLD PHASE 2. Completer avec `cargo tauri init` au besoin.
[package]
name = "clipper"
version = "0.1.0"
edition = "2021"
description = "clipper desktop (Tauri v2 + moteur FastAPI en sidecar)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "clipper"
path = "src/main.rs"
